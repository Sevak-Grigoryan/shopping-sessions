[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
memmap2 = "=0.9.5"
memchr = "=2.7.4"
rayon = "=1.10.0"
rustc-hash = "=2.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
